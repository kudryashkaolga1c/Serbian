<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2347C5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Сербский тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column; home = settings stack, quiz = word card + 4 big answer buttons */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151A2C; --muted:#5C6378; --line:#DCE1EB;
  --accent:#2347C5; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --cyr:#B4441F;
  --good:#1B8A57; --good-soft:#DDF3E8; --bad:#C2372C; --bad-soft:#FBE3E0; --warn:#A86A00; --warn-soft:#FBEFD6;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121B; --surface:#181C29; --ink:#E8EBF3; --muted:#9AA1B6; --line:#2A3042;
  --accent:#7D96FF; --accent-ink:#0F121B; --accent-soft:#232C4D; --cyr:#FF9B73;
  --good:#46C384; --good-soft:#163527; --bad:#F07565; --bad-soft:#3D1D1A; --warn:#E6AE45; --warn-soft:#3A2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121B; --surface:#181C29; --ink:#E8EBF3; --muted:#9AA1B6; --line:#2A3042;
  --accent:#7D96FF; --accent-ink:#0F121B; --accent-soft:#232C4D; --cyr:#FF9B73;
  --good:#46C384; --good-soft:#163527; --bad:#F07565; --bad-soft:#3D1D1A; --warn:#E6AE45; --warn-soft:#3A2C12; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.block{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg.c4{grid-template-columns:repeat(4,1fr)} .seg.c5{grid-template-columns:repeat(5,1fr)}
.len button{font-size:13px;padding:8px 4px}.len small{display:block;font-weight:400;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.trow{display:flex;flex-direction:column;gap:4px}.trow>span{font-size:13px;color:var(--ink)} .seg.c3{grid-template-columns:repeat(3,1fr)} .copts{gap:7px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;font-size:15px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dir small{display:block;font-weight:400;font-size:12px;opacity:.8}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;min-height:56px}
.primary.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 18px rgba(20,30,70,.18)}
.picked{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px}.picked span{color:var(--muted);font-size:13px}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}
.errcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:14px}
.errcard .n{font-family:var(--display);font-size:28px;color:var(--bad);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.errcard .t{flex:1;min-width:0}
.errcard .t b{display:block}
.errcard .t span{color:var(--muted);font-size:13px}
.errcard button{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.errcard.empty{border-left-color:var(--good)} .errcard.empty .n{color:var(--good)}
.stats{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0}
.groups{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{border-top:1px solid var(--line)} .grp:first-child{border-top:0}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:44px}
.grp summary::-webkit-details-marker{display:none}
.grp summary .nm{flex:1;min-width:0;font-weight:600}
.grp summary .cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grp summary .chev{color:var(--muted);transition:transform .2s}
.grp[open] summary .chev{transform:rotate(90deg)}
.themes{display:flex;flex-direction:column;padding:0 14px 10px 44px;gap:2px}
label.ck{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
label.ck input{position:absolute;opacity:0;width:1px;height:1px}
label.ck span.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
label.ck input:checked+span.box{background:var(--accent);border-color:var(--accent)}
label.ck input:checked+span.box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
label.ck input:indeterminate+span.box{background:var(--accent-soft);border-color:var(--accent)}
label.ck input:indeterminate+span.box::after{content:"";width:10px;height:2.5px;background:var(--accent)}
label.ck .lt{flex:1;min-width:0;font-size:15px}
label.ck .lc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.switch .lt{flex:1;min-width:0}
.switch .lt small{display:block;color:var(--muted);font-size:13px}
.tg{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input{position:absolute;opacity:0}
.switch input:checked+.tg{background:var(--accent)}
.switch input:checked+.tg::after{transform:translateX(18px)}
.foot{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;margin-top:auto}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.qtop .pr{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qtop .pr .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .pr .bar i{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.card .th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .w{font-size:clamp(24px,7.5vw,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.card .w.long{font-size:clamp(19px,5.4vw,24px)}
.timer{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;transform:scaleX(1)}
.timer.run i{animation:drain var(--thr) linear forwards}
.timer.over i{background:var(--warn)}
@keyframes drain{to{transform:scaleX(0)}}
.flag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:17px;min-height:58px;font-weight:500;overflow-wrap:anywhere;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.verdict{min-height:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.verdict.fast{color:var(--good)} .verdict.slow{color:var(--warn)} .verdict.wrong{color:var(--bad)}
/* results */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.big3 b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.big3 span{font-size:12px;color:var(--muted)}
.big3 .g b{color:var(--good)} .big3 .s b{color:var(--warn)} .big3 .r b{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.list div{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.list div:first-child{border-top:0}
.list .s{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.list .r{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.btns{display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm .row button{flex:1}
.danger{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}

.move{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.move textarea{width:100%;box-sizing:border-box;font:13px/1.3 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.mvmsg{margin:0;font-weight:600;color:var(--ink)}
.wrow{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%}
.wrow .w{min-width:0}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.qtop .snd{display:grid;place-items:center;color:var(--accent)}
.qtop .snd[aria-pressed="false"]{color:var(--muted)}
.sayans{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent)}
/* изучение */
.modes{grid-template-columns:1fr 1fr}
.hint{margin:0;color:var(--muted);font-size:14px}
.study{min-height:100%}
.scard{flex:1;min-height:52vh;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.scard .th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scard .pic{width:clamp(130px,44vw,190px);height:auto;aspect-ratio:1;object-fit:contain;max-width:100%}
.scard .sw{font-size:clamp(30px,9vw,44px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.scard .sw.long{font-size:clamp(22px,6.4vw,30px)}
.scard .cy{font-size:clamp(22px,6.4vw,32px);font-weight:600;color:var(--cyr);line-height:1.2;overflow-wrap:anywhere;text-wrap:balance;margin-top:-6px}
.scard .fm{font-size:clamp(16px,4.6vw,21px);font-weight:600;color:var(--muted);line-height:1.3;margin-top:-4px;text-wrap:balance}
.scard{position:relative}
.asp{position:absolute;top:12px;right:12px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;opacity:.85;line-height:1.3}
.has-asp .th{margin-top:22px}
.asp-impf{color:var(--accent)}
.asp-pf{color:#2E8B57}
.asp-both{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .asp-pf{color:#6FD39A}}
:root[data-theme="dark"] .asp-pf{color:#6FD39A}
.scard .cj{font-size:.36em;font-weight:500;color:var(--muted);margin-left:.35em;vertical-align:.45em;letter-spacing:.02em}
.scard .pn{font-weight:500;opacity:.6;font-size:.82em}
.scard .cyf{font-size:clamp(14px,4vw,18px);font-weight:600;color:var(--cyr);opacity:.85;line-height:1.3;margin-top:-6px;text-wrap:balance}
.st{position:relative;display:inline-block}
.st::after{content:"";position:absolute;left:50%;top:-.02em;width:.34em;height:.085em;min-height:2px;border-radius:2px;background:#E5352B;transform:translateX(-40%) rotate(-28deg)}
.scard .cy.long{font-size:clamp(17px,4.8vw,22px)}
.scard .tr{font-size:clamp(20px,5.6vw,26px);color:var(--accent);font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;overflow-wrap:anywhere}
.scard .tr.on{opacity:1;transform:none}
.ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.cb{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.cb.main{width:72px;height:72px;background:var(--accent);color:var(--accent-ink);border:0}
.cb:disabled{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.timer.run i{animation:none;transform:scaleX(1)}}

/* ===== компактный вид ===== */
body{font-size:15px}
.wrap{gap:14px;padding-block:14px 24px}
.wrap.home{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h2{font-size:11px;letter-spacing:.08em;font-weight:600}
.top{display:flex;flex-direction:column;gap:8px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl h1{font-size:19px}
.stat{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0 9px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hint{font-size:13px}
.seg.sm{border-radius:10px;padding:3px;gap:2px}
.seg.sm button{min-height:34px;padding:6px 8px;font-size:13.5px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="false"]{color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);min-height:32px}
.chips button small{font-weight:400;opacity:.75;font-variant-numeric:tabular-nums;margin-left:2px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.errcard{padding:9px 10px 9px 14px;gap:10px;border-radius:12px;border-left-width:3px;align-items:center}
.errcard .n{font-size:20px;min-width:auto}
.errcard .t{flex:1;font-size:14px;color:var(--muted)}
.errcard button{padding:7px 12px;font-size:13.5px;border-radius:9px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:28px;position:relative;cursor:default}
.li:first-child{border-top:0}
label.li{cursor:pointer}
.li .lt{font-size:14.5px;flex:1;min-width:0}
.li input{position:absolute;opacity:0;width:1px;height:1px}
.li .tg{width:38px;height:22px;border-radius:11px}
.li .tg::after{width:16px;height:16px}
.li input:checked+.tg{background:var(--accent)}
.li input:checked+.tg::after{transform:translateX(16px)}
.li input:focus-visible+.tg{outline:3px solid var(--accent);outline-offset:2px}
.mini{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px;flex-wrap:wrap;justify-content:flex-end}
.mini button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted);min-height:28px}
.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.settings{border-top:1px solid var(--line);padding-top:4px}
.settings summary{list-style:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"›";transition:transform .2s;font-size:18px;line-height:1}
.settings[open] summary::after{transform:rotate(90deg)}
.setin{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.setin .block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 0 2px;gap:2px}
.setin .block h2{padding:0 12px 4px}
.setin .link{align-self:flex-start;font-size:14px;padding:2px 0}
.danger-link{color:var(--bad)!important}
.note{margin:0;font-size:12px;color:var(--muted)}
.picked{margin:0;font-size:13px;color:var(--muted);background:none;padding:0}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta .primary{display:block;width:100%;max-width:520px;margin:0 auto;min-height:48px;padding:12px;font-size:15.5px;border-radius:12px;box-shadow:0 6px 16px rgba(20,30,70,.18)}
.grp summary{padding:10px 12px;min-height:0}
.grp summary .nm{font-size:14.5px}
.themes{padding:0 12px 8px 14px}
label.ck{padding:5px 0}
label.ck .lt{font-size:14px}
label.ck span.box{width:19px;height:19px;border-radius:5px}
.groups{border-radius:12px}
/* тест */
.qtop .x{width:38px;height:38px;border-radius:10px;font-size:17px}
.card{padding:16px 14px 14px;border-radius:16px;gap:10px}
.card .w{font-size:clamp(22px,6.6vw,30px)}
.say{width:38px;height:38px}
.opts{gap:8px}
.opt{border-width:1.5px;border-radius:12px;padding:11px 14px;min-height:48px;font-size:16px}
.flag{font-size:11.5px}
.verdict{font-size:14px;min-height:20px}
.primary{min-height:48px;padding:12px;font-size:15.5px;border-radius:12px}
.ghost{padding:9px 14px;font-size:14px;border-radius:10px}
.big3 b{font-size:22px}
.big3 div{padding:10px 6px;border-radius:12px}
/* изучение */
.scard{border-radius:20px;padding:20px 16px;min-height:48vh}
.cb{width:48px;height:48px}.cb.main{width:62px;height:62px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:0}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;margin:0;font-size:15px;font-weight:700;color:var(--muted);min-height:44px}

odgovara, recite.","Если вам не подходит, скажите."],["Reci komšiji da ću doći kasnije.","Скажи соседу, что я приду позже."],["Mislim da se komšija preselio.","Думаю, сосед переехал."],["Javi kad si kod kuće.","Дай знать, когда будешь дома."],["Ne znam ko mi je pisao.","Не знаю, кто мне писал."],["Znaš li gde su mi ključevi?","Знаешь, где мои ключи?"],["Pitaj Bubu da li će doći.","Спроси Бубу, придёт ли она."]]},{"n":"Вопросы 1: da li + глагол","w":[["Da li govorite engleski? — Da, govorim. / Malo.","Вы говорите по-английски? — Да, говорю. / Немного."],["Da li je ovo mesto slobodno? — Jeste, izvolite.","Это место свободно? — Да, пожалуйста."],["Da li ste ovde prvi put? — Da, prvi put sam u Srbiji.","Вы здесь впервые? — Да, я в Сербии впервые."],["Da li imate meni na ruskom? — Nažalost, nemamo.","У вас есть меню на русском? — К сожалению, нет."],["Da li vam se sviđa Beograd? — Mnogo mi se sviđa!","Вам нравится Белград? — Очень нравится!"],["Da li si zadovoljna? — Jesam, veoma.","Ты довольна? — Да, очень."],["Da li ćeš doći sutra? — Hoću. / Neću moći.","Ты придёшь завтра? — Приду. / Не смогу."]]},{"n":"Вопросы 2: глагол + li","w":[["Imate li sobu za dve osobe? — Imamo. / Nemamo.","Есть ли у вас номер на двоих? — Есть. / Нет."],["Znaš li gde je pošta? — Znam, tu iza ugla.","Знаешь, где почта? — Знаю, тут за углом."],["Govorite li ruski? — Govorim malo.","Вы говорите по-русски? — Немного говорю."],["Ima li ovde parking? — Ima, u dvorištu.","Здесь есть парковка? — Есть, во дворе."],["Smem li da uđem? — Naravno, uđite.","Можно войти? — Конечно, входите."],["Treba li vam pomoć? — Hvala, ne treba.","Вам нужна помощь? — Спасибо, не нужно."],["Razumete li me? — Razumem. / Ne razumem baš.","Вы меня понимаете? — Понимаю. / Не совсем понимаю."]]},{"n":"Вопросы 3: jesi li, hoćeš li, je l'","w":[["Jesi li umorna? — Malo jesam.","Ты устала? — Немножко."],["Jeste li spremni? — Spremni smo!","Вы готовы? — Готовы!"],["Je li to tvoj auto? — Jeste, moj je.","Это твоя машина? — Да, моя."],["Hoćeš li kafu? — Hoću, hvala.","Хочешь кофе? — Хочу, спасибо."],["Hoćete li da sednete? — Hvala, hoću.","Хотите присесть? — Спасибо, с удовольствием."],["Je l' ima mleka? — Ima, u frižideru.","Молоко есть? — Есть, в холодильнике."],["Jel' sve u redu? — Sve je u redu.","Всё нормально? — Всё в порядке."],["Jel' možeš sutra? — Mogu posle podne.","Ты завтра сможешь? — Смогу после обеда."],["Ideš sa nama? — Idem!","Идёшь с нами? — Иду!"],["Ti si iz Rusije? — Jesam, iz Jekaterinburga.","Ты из России? — Да, из Екатеринбурга."]]},{"n":"Вопросы 4: где, когда, почему…","w":[["Gde si bila? — Bila sam u gradu.","Где ты была? — Я была в городе."],["Šta ti se desilo? — Ništa, sve je u redu.","Что с тобой случилось? — Ничего, всё хорошо."],["Kada ćeš doći? — Doći ću u pet.","Когда ты придёшь? — Приду в пять."],["Zašto mi nisi rekla? — Zato što sam zaboravila.","Почему ты мне не сказала? — Потому что я забыла."],["Kako se kaže na srpskom...? — Kaže se...","Как сказать по-сербски…? — Говорят…"],["Odakle ste? — Ja sam iz Rusije.","Откуда вы? — Я из России."],["Kuda ideš? — Idem u prodavnicu.","Куда идёшь? — Иду в магазин."],["Čiji je ovo telefon? — Moj je.","Чей это телефон? — Мой."],["S kim živiš? — Živim sa porodicom.","С кем ты живёшь? — Я живу с семьёй."],["Koliko dugo ostajete? — Ostajemo dve nedelje.","Как долго вы пробудете? — Мы пробудем две недели."]]},{"n":"Вопросы 5: zar ne, вежливо и ответы","w":[["Lepo je, zar ne? — Jeste, prelepo!","Красиво, правда? — Да, очень красиво!"],["Je l' da? — Naravno da jeste.","Правда ведь? — Конечно."],["Zar ne znaš? — Ne, nisam znala.","Разве ты не знаешь? — Нет, я не знала."],["Izvinite, da li znate gde je apoteka? — Pravo, pa levo.","Извините, вы не знаете, где аптека? — Прямо, потом налево."],["Da li biste mogli da mi pomognete? — Naravno, kako mogu da pomognem?","Не могли бы вы мне помочь? — Конечно, чем могу помочь?"],["Ne znaš slučajno gde je stanica? — Znam, odmah tu.","Ты случайно не знаешь, где остановка? — Знаю, совсем рядом." /* ---------- quiz ---------- */
let run=null,timers=[];
function clearT(){timers.forEach(clearTimeout);timers=[]}
function start(mode,given){
  clearT();
  let q;
  if(given){q=given}
  else if(mode==='errors'){q=shuffle(errList(S.dir))}
  else{q=shuffle(available());if(S.size!=='all')q=q.slice(0,S.size)}
  if(!q.length){home();return}
  run={mode,dir:S.dir,q,i:0,res:[]};
  if(S.voice)preload(q);
  show();
}
function options(w){
  const ans=x=>run.dir==='sr'?x.ru:x.sr;
  const right=ans(w), norm=s=>s.toLowerCase().replace(/[.!?,…]/g,'').trim();
  // синонимы не годятся в неверные варианты: если у кандидата совпадает хотя бы одно значение
  // с вопросом или с правильным ответом, его не показываем (stvarno / zaista = «действительно»)
  const parts=s=>String(s).toLowerCase().replace(/ё/g,'е').split(/[,;/(]|\s—\s/).map(t=>t.replace(/[.!?…)]/g,'').trim()).filter(Boolean);
  const qs=x=>run.dir==='sr'?x.sr:x.ru;
  const PQ=new Set(parts(qs(w))),PA=new Set(parts(right));
  const clash=x=>parts(qs(x)).some(p=>PQ.has(p))||parts(ans(x)).some(p=>PA.has(p));
  const bad=new Set(W.filter(x=>x.key!==w.key&&clash(x)).map(x=>norm(ans(x))));
  const r=rec(run.dir,w.key), prev=(r.d||[]).filter(p=>norm(p)!==norm(right)&&!bad.has(norm(p))&&!parts(p).some(t=>PA.has(t)));
  const used=new Set([norm(right)]);const out=[];
  // на повторе: часть прошлых вариантов остаётся (случайно 0–3), остальные заменяются новыми
  if(prev.length){
    const change=[0,1,1,2,2,3][Math.floor(Math.random()*6)];
    for(const p of shuffle(prev.slice()).slice(0,Math.max(0,3-change))){used.add(norm(p));out.push(p)}
    prev.forEach(p=>used.add(norm(p)));
  }
  const tryFrom=list=>{for(const x of shuffle(list.slice())){if(out.length>=3)return;const a=ans(x);if(used.has(norm(a))||clash(x)||bad.has(norm(a)))continue;used.add(norm(a));out.push(a)}};
  tryFrom(DATA[w.gi].t[w.ti].w.map(([sr,ru])=>({sr,ru})));
  if(out.length<3)tryFrom(W.filter(x=>x.gi===w.gi&&x.b===w.b));
  if(out.length<3)tryFrom(W.filter(x=>x.gi===w.gi));
  if(out.length<3)tryFrom(W);
  r.d=out.slice(0,3);
  const opts=shuffle([right,...out.slice(0,3)]);
  return {opts,ok:opts.indexOf(right)};
}
function show(){
  clearT();
  const w=run.q[run.i];const {opts,ok}=options(w);run.cur={w,opts,ok,done:false};
  const prompt=run.dir==='sr'?w.sr:w.ru;
  const total=run.q.length,pos=run.i+1;
  app.innerHTML=`<div class="wrap">
   <div class="qtop"><button class="x" data-act="quit" aria-label="Выйти">×</button>
    <div class="pr"><div class="lbl"><span>${run.mode==='errors'?'Работа над ошибками':esc(w.g)}</span><span>${pos} / ${total}</span></div>
    <div class="bar"><i style="width:${((pos-1)/total*100).toFixed(1)}%"></i></div></div>
    ${anySound()?`<button class="x snd" data-act="snd" aria-pressed="${S.voice}" aria-label="Озвучка">${S.voice?SPK:MUTE}</button>`:''}</div>
   <div class="card"><span class="th">${esc(w.th)}</span>
    <div class="wrow"><div class="w${prompt.length>28?' long':''}" lang="${run.dir==='sr'?'sr-Latn':'ru'}">${run.dir==='sr'?stv(mk(prompt)):esc(prompt)}</div>${run.dir==='sr'&&canSay(w)?`<button class="say" data-act="say" aria-label="Послушать">${SPK}</button>`:''}</div>
    <div class="timer" id="tm" style="--thr:${thrOf(w)}s"><i></i></div>
    <span class="flag">${run.dir==='sr'?'Выбери перевод на русский':'Выбери слово на сербском'}</span></div>
   <div class="opts">${opts.map((o,k)=>`<button class="opt" data-opt="${k}" lang="${run.dir==='sr'?'ru':'sr-Latn'}">${esc(o)}</button>`).join('')}</div>
   <div class="verdict" id="vd" aria-live="polite"></div><div id="nx"></div></div>`;
  const cur=run.cur;
  const go=()=>{if(!run||run.cur!==cur||cur.done)return;run.t0=performance.now();const tm=document.getElementById('tm');if(tm){tm.classList.add('run');timers.push(setTimeout(()=>tm.classList.add('over'),thrOf(w)*1000))}};
  run.t0=0;
  // секунды пойдут только после того, как слово прозвучало
  if(S.voice&&run.dir==='sr'&&canSay(w))requestAnimationFrame(()=>sayWord(w,go));else requestAnimationFrame(go);
}
function pick(k){
  const c=run.cur;if(!c||c.done)return;c.done=true;clearT();
  const t=run.t0?performance.now()-run.t0:0;
  const right=k===c.ok, fast=right&&t<=thrOf(c.w)*1000;
  const r=rec(run.dir,c.w.key);
  let res;
  if(fast){r.k=1;r.e=0;r.s=0;res='fast'}
  else if(right){r.k=0;r.s=(r.s||0)+1;r.e=r.s>=7?0:1;res='slow'}
  else{r.k=0;r.e=1;r.s=0;r.w=(r.w||0)+1;res='wrong'}
  save();
  run.res.push({w:c.w,res,t});
  const btns=app.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  btns[c.ok].classList.add('ok');if(!right)btns[k].classList.add('no');
  const tm=document.getElementById('tm');if(tm){tm.classList.remove('run');tm.style.visibility='hidden'}
  const vd=document.getElementById('vd');
  if(res==='fast'){vd.className='verdict fast';vd.textContent='Верно · '+sec(t)}
  else if(res==='slow'){vd.className='verdict slow';vd.textContent='Верно, но медленно ('+sec(t).replace(' с','')+' из '+String(thrOf(c.w)).replace('.',',')+' с)'+(r.e?' · повторим':' · уже 7 раз, хватит')}
  else{vd.className='verdict wrong';vd.textContent='Неверно · слово ушло в ошибки'}
  const sayAns=S.voice&&run.dir==='ru'&&canSay(c.w);
  if(run.dir==='ru'&&canSay(c.w))document.getElementById('nx').insertAdjacentHTML('beforebegin','<button class="ghost sayans" data-act="say">'+SPK+'<span>Послушать: '+esc(c.w.sr)+'</span></button>');
  if(right){if(sayAns){const me=c;sayWord(c.w,()=>{if(run&&run.cur===me)timers.push(setTimeout(next,400))})}else timers.push(setTimeout(next,res==='fast'?650:1100))}
  else{if(sayAns)sayWord(c.w);document.getElementById('nx').innerHTML='<button class="primary" data-act="next" style="width:100%">Дальше</button>';document.querySelector('[data-act="next"]').focus({preventScroll:true})}
}
function next(){clearT();hush();if(!run)return;run.i++;if(run.i>=run.q.length)results();else show()}
document.addEventListener('keydown',e=>{if(!run||!run.cur)return;if(/^[1-4]$/.test(e.key)&&!run.cur.done)pick(+e.key-1);else if((e.key==='Enter'||e.key===' ')&&run.cur.done&&document.querySelector('[data-act="next"]')){e.preventDefault();next()}});

const AW={lock:null,on:false,vid:null};
function getLock(){try{if(AW.on&&navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(l=>{if(AW.on){AW.lock=l}else l.release()}).catch(()=>{})}catch(e){}}
function awake(on){
  AW.on=on;
  if(on){
    getLock();

const CYR_KEEP=/^(viber|wi-fi|wifi|pvc|sms|pin|usb|tv|dvd|cd|gps|ok|pdv|e-mail|email)$/i;
const CYR_EX=[[/injek/gi,'инјек'],[/konjunk/gi,'конјунк'],[/konjug/gi,'конјуг'],[/\b(n|N)adž/g,'$1aДЖ'],[/\b(o|O)dž/g,'$1ДЖ'],[/\b(p|P)odž/g,'$1oДЖ'],[/\b(p|P)redž/g,'$1reДЖ']];
const CYR_D={'lj':'љ','nj':'њ','dž':'џ','Lj':'Љ','LJ':'Љ','Nj':'Њ','NJ':'Њ','Dž':'Џ','DŽ':'Џ'};
const CYR_S={a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж'};
function cyrWord(t){
  if(CYR_KEEP.test(t)||/[wqxy]/i.test(t)||(t.length>1&&t.length<5&&t===t.toUpperCase()&&/[A-Z]/.test(t)))return t;
  CYR_EX.forEach(([r,s])=>{t=t.replace(r,s)});
  t=t.replace(/ДЖ/g,'§');
  t=t.replace(/LJ|Lj|lj|NJ|Nj|nj|DŽ|Dž|dž/g,m=>CYR_D[m]);
  t=t.replace(/[a-zčćđšž]/gi,ch=>{const l=ch.toLowerCase(),c=CYR_S[l];if(!c)return ch;return ch===l?c:c.toUpperCase()});
  return t.replace(/§/g,'дж');
}
function cyr(s){return s.split(/(Halo oglas\w*)/).map((p,i)=>i%2?p:p.replace(/[A-Za-zČĆĐŠŽčćđšž-]+/g,cyrWord)).join('')}

const STR=(()=>{try{return JSON.parse(document.getElementById('stress').textContent)}catch(e){return{}}})();
const mk=s=>S.stress===false?s:String(s).replace(/[A-Za-zČĆŽŠĐčćžšđ]+/g,x=>{const i=STR[x.toLowerCase()];return i==null?x:x.slice(0,i)+'`'+x.slice(i)});
const SL=(w,k)=>mk(k?w.fm[k-1]:w.sr);
// формы: у неправильных глаголов все 6 лиц — две строки по три + повелительное
const PRN=s=>`<span class="pn">${s}</span> `;
function fmH(w,f){const x=w.fm.map((_,k)=>f(SL(w,k+1)));
  if(x.length<6)return [PRN('ja')+x[0],PRN('oni')+x[1]].concat(x[2]?[x[2]+'!']:[]).join(' · ');
  const P=['ja','ti','on','mi','vi','oni'];const y=x.slice(0,6).map((s,k)=>PRN(P[k])+s);
  return y.slice(0,3).join(' · ')+'<br>'+y.slice(3).join(' · ')+(x[6]?'<br>'+x[6]+'!':'')}

const IRRV=new Set(['biti','hteti','moći','ići','doći','otići','naći','jesti','reći','pomoći','uzeti','dati','sesti','leći','početi']);
function cjH(w){if(!w.fm||!w.fm.length)return'';let t;

  return `<small class="cj">(${t})</small>`}

async function runCard(w){
  const tok=++st.tok, me=st, ok=()=>st===me&&st.tok===tok&&st.play;
  const snd=S.voice&&canSay(w);
  const reveal=()=>{const t=document.getElementById('tr');if(t)t.classList.add('on');const e=document.getElementById('ex');if(e)e.classList.add('on')};
  if(snd){
    await wait(300);if(!ok())return;
    const ch=w.fm?await loadF(w).then(j=>!!(j.f||{})[w.sr]):false;if(!ok())return;
    await new Promise(r=>sayWord(w,r,ch));if(!ok())return;
    // у прилагательных три формы и у глаголов «паровозик» звучат один раз
    if(w.g!=='Прилагательные'&&!ch&&(S.rep||2)>1){await wait(700);if(!ok())return;
    await new Promise(r=>sayWord(w,r));if(!ok())return;}
    await wait(600);if(!ok())return;
    reveal();await new Promise(r=>sayRu(w,r));if(!ok())return;
    if(w.ex&&S.exs!==false&&S.exv&&(!w.fm||S.exvv)){const b=await (w.fm?loadF(w).then(j=>(j.e||{})[w.ex[0]]):loadG(w.gi).then(j=>(j.s||{})[w.ex[0]])).catch(()=>null);if(!ok())return;
      if(b){await wait(500);if(!ok())return;await new Promise(r=>playB64(b,r));if(!ok())return;}}
  }else{
    await wait(2200+w.sr.length*40);if(!ok())return;
    reveal();await wait(1500+w.ru.length*30);if(!ok())return;
  }
  await wait(S.sp*1000);if(!ok())return;
  st.i++;if(st.i>=st.q.length)studyEnd();else showCard();
}

const ENC_SL=[['kN','li','вопрос'],['kG','sam · ću · bih','быть, буду, бы (кроме je)'],['kD','mi · ti · mu · joj…','кому?'],['kA','me · te · ga · je…','кого?'],['kL','se','-ся'],['kI','je','есть / был(а)']];

  <section class="csec"><h2>Что это такое</h2>
   <p class="use">Энклитики — короткие слова <b>без своего ударения</b>. Сами по себе не стоят, всегда цепляются за слово перед ними. Поэтому у них в предложении своё твёрдое место — по пяти правилам ниже. Дальше — отдельно про se, про будущее (ću) и про то, какие падежи бывают короткими.</p>
   <table class="ends enct"><tbody>

   ${encEx([['Ja *sam te* juče zvala.','Я тебе вчера звонила.'],['Juče *sam te* zvala.','Вчера я тебе звонила.'],['Zvala *sam te* juče.','Звонила я тебе вчера.'],['Moja drugarica *me je* zvala.','Моя подружка мне звонила. — «moja drugarica» одна группа']])}

  <section class="csec kG"><h2><span class="cbadge kG">2</span>Порядок всегда одинаковый</h2>

   <p class="mini-n">Запомнить: <b>сначала «кому», потом «кого»</b> — <span lang="sr-Latn">dam ti ga</span>, а не <s lang="sr-Latn">dam ga ti</s>.</p></section>

   <p class="use">Все формы <b>sam, si, smo, ste, su</b> стоят в начале цепочки, а <b>je</b> (он/она был, есть) — в самом конце, после всех остальных.</p>
   ${encEx([['Ko *me je* zvao?','Кто мне звонил?'],['Buba *mi je* pisala.','Буба мне писала.'],['Buba *ga je* videla.','Буба его видела.'],['Hladno *mi je*.','Мне холодно.'],['Drago *mi je*.','Очень приятно.']])}
   <p class="mini-n"><b>se + je</b>: после <b>se</b> слово je обычно выпадает — <span lang="sr-Latn">Buba <b class="enc">se</b> vratila</span> (а не «se je»).</p>
   <p class="mini-n"><b>je «её» + je «был»</b> рядом не ставят — вместо «её» говорят <b>ju</b>: <span lang="sr-Latn">Video <b class="enc">ju je</b>.</span> — Он её видел.</p></section>

  <section class="csec kA"><h2><span class="cbadge kA">4</span>Отрицание, потом энклитика</h2>
   <p class="use"><b>nisam, nisi, nije, nismo, niste, nisu, neću</b> — это полные слова с ударением, они могут стоять первыми. Энклитики идут сразу за ними.</p>
   ${encEx([['Nisam *vas* čula.','Я вас не услышала.'],['Nije *mi* dobro.','Мне нехорошо.'],['Nismo *se* videli.','Мы не виделись.'],['Neću *ti* smetati.','Я не буду тебе мешать.']])}
   <p class="use">А <b>ne</b> сливается с глаголом в одно слово — энклитика встаёт <b>после глагола</b>:</p>
   ${encEx([['Ne zovi *me*.','Не звони мне.'],['Ne sviđa *mi se*.','Мне не нравится.'],['Ne čujem *vas*.','Я вас не слышу.']])}
   <p class="mini-n">Нельзя: <s lang="sr-Latn">Ne me zovi</s>.</p></section>

  <section class="csec kL"><h2><span class="cbadge kL">5</span>После союза — сразу энклитики</h2>
   <p class="use">Во второй части сложной фразы первым словом считается союз или вопросительное слово: <b>da, ako, kad, gde, ko, šta, što</b>. Энклитики встают сразу за ним.</p>
   ${encEx([['Mislim da *sam vas* već zvala.','Кажется, я вам уже звонила.'],['Ako *vam* ne odgovara, recite.','Если вам не подходит, скажите.'],['Ne znam ko *mi je* pisao.','Не знаю, кто мне писал.'],['Znaš li gde *su mi* ključevi?','Знаешь, где мои ключи?'],['Javi kad *si* kod kuće.','Дай знать, когда будешь дома.']])}</section>

  <section class="csec kL"><h2><span class="cbadge kL">se</span>Куда встаёт se</h2>
   <p class="use"><b>se</b> — не «в конец предложения», а <b>в конец цепочки энклитик</b>. Сама цепочка, как всегда, стоит после первого слова. Перед se могут быть li, sam/ću/bih и «кому»; после se — только je, но je рядом с se выпадает. Поэтому se почти всегда последняя в кучке.</p>
   ${encEx([['Vratila *se* iz Budve.','Вернулась из Будвы. — se одна'],['Sviđa *mi se*.','Мне нравится. — кому → se'],['Javi*ću ti se* sutra.','Свяжусь с тобой завтра. — кому → se'],['Ja *ću se* vratiti.','Я вернусь. — ću → se'],['Rado *bih se* odmorila.','С удовольствием бы отдохнула. — bih → se'],['Da *li si se* naspavala?','Ты выспалась? — li → si → se'],['Ivan *se* vratio.','Иван вернулся. — было бы «se je», je выпало']])}
   <p class="mini-n">От конца фразы se может быть далеко: <span lang="sr-Latn">Ja <b class="enc">ću se</b> sutra ujutru vratiti kući.</span></p></section>

  <section class="csec kG"><h2><span class="cbadge kG">ću</span>Будущее: ću, ćeš, će…</h2>
   <p class="use">Будущее время = <b>ću, ćeš, će, ćemo, ćete, će</b> + инфинитив. Эти слова — энклитики, место у них то же, что у sam: <b>второе</b>, ячейка 2 в цепочке. Первыми не бывают никогда.</p>
   ${encEx([['Ja *ću* doći.','Я приду.'],['Sutra *ću* doći.','Завтра приду.'],['Večeras *ću* šetati pse.','Сегодня вечером буду гулять с собаками.'],['Kupi*ću joj ga*.','Куплю ей его. — ću → кому → кого']])}
   <p class="use">Если первым идёт сам глагол, ću прилипает к нему: <b>-ti</b> отпадает и пишется слитно.</p>
   ${encEx([['Vrati*ću se*.','Вернусь. — vratiti → vrati + ću'],['Javi*ćemo vam*.','Мы вам сообщим. — javiti → javi + ćemo'],['Doći *ću*. · Reći *ću ti*.','Приду. · Скажу тебе. — глаголы на -ći пишутся раздельно']])}
   <p class="use">Полные формы <b>hoću, hoćeš, hoće…</b> — обычные слова, они бывают первыми: в вопросе с li и в коротком ответе. <b>neću, nećeš…</b> — отрицание, тоже полное слово (правило 4).</p>
   ${encEx([['Hoćeš li doći? — Hoću.','Придёшь? — Приду.'],['Da li *ćeš* doći?','Придёшь? — то же самое, через da li'],['Neću *ti* smetati.','Не буду тебе мешать.']])}
   <p class="mini-n">Нельзя: <s lang="sr-Latn">Ću doći</s>.</p></section>

  <section class="csec kD"><h2><span class="cbadge kD">?</span>Какие падежи бывают короткими</h2>
   <p class="use">Короткие формы есть только у двух вопросов:</p>
   <table class="ends enct"><tbody>
    <tr><th>кому?</th><td lang="sr-Latn">mi ti mu joj · nam vam im</td></tr>
    <tr><th>кого?</th><td lang="sr-Latn">me te ga je · nas vas ih</td></tr></tbody></table>
   <p class="use">«Кого? чего? <b>нет</b>» (родительный) пользуется теми же формами, что «кого?»:</p>
   ${encEx([['Nema *ga*.','Его нет.'],['Bojim *ih se*.','Я их боюсь.']])}
   <p class="use">«О ком?», «с кем?», «у кого?» коротких форм не имеют — там всегда полные: <span lang="sr-Latn">o meni, sa mnom, o njemu, kod nje</span>.</p>
   <p class="use"><b>После предлога энклитики не бывает никогда</b> — только полная форма:</p>
   ${encEx([['Ovo je za mene.','Это для меня. — не «za me»'],['Ljuta sam na njega.','Я на него злюсь.'],['Idem sa njom.','Иду с ней.'],['Mislim na tebe.','Думаю о тебе.']])}</section>

  <section class="csec"><h2>Как собрать фразу</h2><ul class="spec">
   <li>Найди <b>первое слово</b> (или первую группу, союз, вопросительное слово, nisam/nije…).</li>
   <li>Сразу за ним поставь <b>все энклитики</b> одной кучкой.</li>
   <li>Внутри кучки: <b>li → sam/ću/bih → кому → кого → se → je</b>.</li>
   <li>После <b>ne</b> энклитика идёт за глаголом: <span lang="sr-Latn">ne zovi me</span>.</li>
   <li>После <b>предлога</b> — всегда полная форма: <span lang="sr-Latn">za mene, sa njom</span>.</li></ul>
   <p class="mini-n">Примеры на каждое правило — в «Основных фразах», темы «Энклитики 1…5». По книге В. В. Чарского «Сербский язык. Справочник по глаголам».</p></section>
  <button class="ghost" ${back}>Назад</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- шпаргалка: как задать вопрос ---------- */
function qSheet(){
  run=null;if(st)stopStudy();
  const back='data-act="home"';
  app.innerHTML=`<div class="wrap sheet">
  <div class="qtop"><button class="x" ${back} aria-label="Назад">×</button><div class="pr"><div class="lbl"><span>Шпаргалка</span><span>как задать вопрос</span></div></div></div>
  <section class="csec"><h2>Главное</h2>
   <p class="use">В русском вопрос часто отличается только интонацией. В сербском тоже так можно, но обычно вопрос <b>помечают словом</b>: <b>da li</b>, <b>li</b> или <b>je l'</b>. Если в вопросе есть вопросительное слово (gde, kada, zašto…), ничего добавлять не нужно.</p></section>

  <section class="csec kN"><h2><span class="cbadge kN">1</span>Da li + глагол</h2>
   <p class="use">Самый простой и универсальный способ — подходит всегда. После каждого вопроса — как на него ответить. Ставишь <b>da li</b> в начало, дальше обычная фраза. Энклитики встают сразу после li.</p>
   ${encEx([['Da li govorite engleski? — Da, govorim. / Malo.','Вы говорите по-английски? — Да, говорю. / Немного.'],['Da li *je* ovo mesto slobodno? — Jeste, izvolite.','Это место свободно? — Да, пожалуйста.'],['Da li *ste* ovde prvi put? — Da, prvi put sam u Srbiji.','Вы здесь впервые? — Да, я в Сербии впервые.'],['Da li *vam se* sviđa Beograd? — Mnogo mi se sviđa!','Вам нравится Белград? — Очень нравится!'],['Da li *ćeš* doći sutra? — Hoću. / Neću moći.','Ты придёшь завтра? — Приду. / Не смогу.']])}</section>

  <section class="csec kG"><h2><span class="cbadge kG">2</span>Глагол + li</h2>
   <p class="use">Глагол выносишь <b>в начало</b>, сразу за ним — <b>li</b>. Звучит чуть аккуратнее, очень частый вариант. Похоже на русское «Знаешь ли ты…», только в сербском это совсем не книжно.</p>
   ${encEx([['Imate li sobu za dve osobe? — Imamo. / Nemamo.','Есть ли у вас номер на двоих? — Есть. / Нет.'],['Znaš li gde je pošta? — Znam, tu iza ugla.','Знаешь, где почта? — Знаю, тут за углом.'],['Govorite li ruski? — Govorim malo.','Вы говорите по-русски? — Немного говорю.'],['Možete li malo sporije? — Naravno, mogu.','Можете чуть помедленнее? — Конечно, могу.'],['Treba li *vam* pomoć? — Hvala, ne treba.','Вам нужна помощь? — Спасибо, не нужно.']])}</section>

  <section class="csec kI"><h2><span class="cbadge kI">3</span>«Быть» и «хотеть» — полные формы</h2>
   <p class="use">sam, si, je… и ću, ćeš… — энклитики, первыми стоять не могут. Поэтому в вопросе с li берутся <b>полные формы</b>:</p>
   <table class="ends enct"><tbody>
    <tr><th>biti</th><td lang="sr-Latn">jesam li · jesi li · je li · jesmo li · jeste li · jesu li</td></tr>
    <tr><th>hteti</th><td lang="sr-Latn">hoću li · hoćeš li · hoće li · hoćemo li · hoćete li · hoće li</td></tr></tbody></table>
   ${encEx([['Jesi li umorna? — Malo jesam.','Ты устала? — Немножко. (= Da li si umorna?)'],['Jeste li spremni? — Spremni smo!','Вы готовы? — Готовы!'],['Je li to tvoj auto? — Jeste, moj je.','Это твоя машина? — Да, моя.'],['Hoćeš li kafu? — Hoću, hvala.','Хочешь кофе? — Хочу, спасибо.'],['Hoćete li da sednete? — Hvala, hoću.','Хотите присесть? — Спасибо, с удовольствием.']])}
   <p class="mini-n">Нельзя: <s lang="sr-Latn">Si li umorna?</s>, <s lang="sr-Latn">Ćeš li doći?</s></p></section>

  <section class="csec kA"><h2><span class="cbadge kA">4</span>Je l' / jel' — разговорное</h2>
   <p class="use"><b>Je l'</b> (пишут и <b>jel'</b>) — это сокращённое je li. В разговоре его ставят в начало почти любого вопроса, как русское «а…?» или «…, да?».</p>
   ${encEx([["Je l' ima mleka? — Ima, u frižideru.",'Молоко есть? — Есть, в холодильнике.'],["Jel' sve u redu? — Sve je u redu.",'Всё нормально? — Всё в порядке.'],["Jel' možeš sutra? — Mogu posle podne.",'Ты завтра сможешь? — Смогу после обеда.']])}
   <p class="use">И можно просто <b>интонацией</b>, как по-русски:</p>
   ${encEx([['Ideš sa nama? — Idem!','Идёшь с нами? — Иду!'],['Ti si iz Rusije? — Jesam, iz Jekaterinburga.','Ты из России? — Да, из Екатеринбурга.']])}</section>

  <section class="csec kL"><h2><span class="cbadge kL">5</span>Вопросительные слова</h2>
   <p class="use">С <b>ko, šta, gde, kada, zašto, kako, koliko, koji, čiji, odakle, kuda</b> ни da li, ни li не нужны. Энклитики встают сразу после вопросительного слова (правило 5 из энклитик).</p>
   ${encEx([['Gde *si* bila? — Bila sam u gradu.','Где ты была? — Я была в городе.'],['Šta *ti se* desilo? — Ništa, sve je u redu.','Что с тобой случилось? — Ничего, всё хорошо.'],['Kada *ćeš* doći? — Doći ću u pet.','Когда ты придёшь? — Приду в пять.'],['Zašto *mi* nisi rekla? — Zato što sam zaboravila.','Почему ты мне не сказала? — Потому что я забыла. (zašto? → zato što…)'],['Čiji *je* ovo telefon? — Moj je.','Чей это телефон? — Мой.'],['Koliko dugo ostajete? — Ostajemo dve nedelje.','Как долго вы пробудете? — Мы пробудем две недели.']])}</section>

  <section class="csec kD"><h2><span class="cbadge kD">+</span>Хвостики, вежливость, «разве»</h2>
   ${encEx([['Lepo je, zar ne? — Jeste, prelepo!','Красиво, правда? — Да, очень красиво! (zar ne = не так ли)'],["Je l' da? — Naravno da jeste.",'Правда ведь? — Конечно.'],['Zar ne znaš? — Ne, nisam znala.','Разве ты не знаешь? — Нет, не знала. (zar = разве)'],['Izvinite, da li znate gde je apoteka? — Pravo, pa levo.','Извините, вы не знаете, где аптека? — Прямо, потом налево.'],['Da li biste mogli da mi pomognete? — Naravno, kako mogu da pomognem?','Не могли бы вы мне помочь? — Конечно, чем могу помочь? (самое вежливое)'],['Ne znaš slučajno gde je stanica? — Znam, odmah tu.','Ты случайно не знаешь, где остановка? — Знаю, совсем рядом.']])}</section>

  <section class="csec kG"><h2><span class="cbadge kG">!</span>Как отвечать</h2>
   <p class="use">Можно просто <b>da</b> или <b>ne</b>. Но сербы любят отвечать <b>тем же глаголом</b> — звучит очень естественно:</p>
   ${encEx([['Imate li sobu? — Imamo. / Nemamo.','Есть номер? — Есть. / Нет.'],['Jesi li gladna? — Jesam. / Nisam.','Ты голодна? — Да. / Нет.'],['Hoćeš li sa mnom? — Hoću! / Neću.','Пойдёшь со мной? — Пойду! / Нет.'],['Znaš li? — Znam. / Ne znam.','Знаешь? — Знаю. / Не знаю.']])}</section>

  <section class="csec"><h2>Коротко</h2><ul class="spec">
   <li>Не уверена — начинай с <b>Da li…</b>, это всегда правильно.</li>
   <li>Глагол первым — сразу за ним <b>li</b>: <span lang="sr-Latn">Imate li…?</span></li>
   <li>«Быть» и «хотеть» — полные формы: <span lang="sr-Latn">Jesi li…? Hoćeš li…?</span></li>
   <li>Есть gde / kada / zašto… — больше ничего не нужно.</li></ul>
   <p class="mini-n">Примеры — в «Основных фразах», темы «Вопросы 1…5».</p></section>
  <button class="ghost" ${back}>Назад</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- поиск слова или фразы ---------- */
let srchQ='',srchOn=false,srchRes=[];
const SR2L={'љ':'lj','њ':'nj','џ':'dz','ђ':'dj','ћ':'c','ч':'c','ш':'s','ж':'z','ј':'j','а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','з':'z','и':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c'};
const fold=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/đ/g,'dj').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
const toLat=s=>s.replace(/[а-яёђћџљњј]/g,c=>SR2L[c]!==undefined?SR2L[c]:c);
let SIDX=null;
function sIndex(){if(SIDX)return SIDX;const seen=new Map();SIDX=[];
  W.forEach(w=>{const k=w.key;if(seen.has(k)){seen.get(k).more++;return}const o={w,fs:fold(w.sr),fr:fold(w.ru),more:0};seen.set(k,o);SIDX.push(o)});return SIDX}
function sScore(h,q){if(h===q)return 0;if(h.startsWith(q+' ')||h.startsWith(q))return 1;if((' '+h).includes(' '+q))return 2;if(h.includes(q))return 3;return 9}
function doSearch(raw){const q=fold(raw);if(q.length<2)return[];const ql=toLat(q);
  const out=[];for(const o of sIndex()){const a=Math.min(sScore(o.fs,q),sScore(o.fs,ql)),b=sScore(o.fr,q),s=Math.min(a,b);if(s<9)out.push([s,o.fs.length+o.fr.length,o])}
  out.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);return out.map(x=>x[2])}
function shl(text,q){const f=fold(q);if(f.length<2)return esc(text);
  const tl=toLat(f);const src=String(text);const fl=src.toLowerCase().replace(/ё/g,'е').replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(fl.length!==src.length)return esc(src);
  for(const t of [f,tl]){const i=fl.indexOf(t);if(i>=0)return esc(src.slice(0,i))+'<mark>'+esc(src.slice(i,i+t.length))+'</mark>'+esc(src.slice(i+t.length))}
  return esc(src)}
function searchView(){run=null;if(st)stopStudy();srchOn=true;
  app.innerHTML=`<div class="wrap srch">
   <div class="qtop"><button class="x" data-act="srchclose" aria-label="Назад">×</button>
    <label class="sbox"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="sq" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="сербское или русское слово" value="${esc(srchQ)}"></label></div>
   <div id="sres" aria-live="polite"></div></div>`;
  const inp=document.getElementById('sq');inp.addEventListener('input',()=>{srchQ=inp.value;renderRes()});
  renderRes();setTimeout(()=>{try{inp.focus()}catch(e){}},50)}
function renderRes(){const box=document.getElementById('sres');if(!box)return;
  if(fold(srchQ).length<2){box.innerHTML=`<div class="shint"><p>Набери хотя бы две буквы.</p><ul>
    <li>Ищет и по-сербски, и по-русски: «prozor» или «окно».</li>
    <li>Фразу найдёшь по любому слову из неё: «kafu», «билет».</li>
    <li>Галочки над буквами не нужны: «zelim» найдёт «želim». Можно и кириллицей.</li>
    <li>Нажми на строку — прозвучит по-сербски и по-русски.</li></ul></div>`;return}
  srchRes=doSearch(srchQ);const N=srchRes.length,show=srchRes.slice(0,80);

function ruleOf(r){
  const out=[];const before=r.s.slice(0,r.s.indexOf('[')).trim().split(/\s+/).pop().toLowerCase().replace(/[^a-zčćđšž]/g,'');
  const g=CD.nouns[r.n].g;
  if(PR[r.c]&&PR[r.c][before])out.push('Предлог '+PR[r.c][before]);
  else if(r.c==='D'&&/raduj/i.test(r.s))out.push('Radovati se + Д.п.: радоваться чему?');
  else if(r.c==='I'&&/zadovoljn/i.test(r.s))out.push('Biti zadovoljna + Т.п.: довольна кем? чем?');
  else if(r.c==='N')out.push(/\b(je|su)\s+(moj\w*\s+|tvoj\w*\s+)?\[/i.test(r.s)?'Именная часть сказуемого: после «je / su» (Ovo je…) тоже И.п.':'Подлежащее — о нём говорится в предложении.');
  else if(r.c==='G'){const m=r.s.match(/\b(nema|nemam|mnogo|dosta|malo|litar|kilo|čaša|pet|šest|deset)\b/i);out.push(m?'После «'+m[1].toLowerCase()+'» — отсутствие или количество.':'Р.п. после этого слова или выражения.')}
  else if(r.c==='D')out.push('Тот, кому адресовано действие.');
  else if(r.c==='A')out.push('На это направлено действие.');
  else if(r.c==='I')out.push('Чем? — инструмент, способ, транспорт или путь.');
  if(r.c==='A'&&r.num==='s'&&g==='mo')out.push('Одушевлённый м.р.: В.п. = Р.п. (vidim brata).');
  if(r.c==='A'&&r.num==='s'&&g==='m')out.push('Неодушевлённый м.р.: В.п. = И.п. (vidim stan).');
  if(r.c==='A'&&r.num==='p'&&(g==='m'||g==='mo')&&r.n!=='brat')out.push('У обычных слов м.р. В.п. мн.ч. на -e, одушевлённость не важна (stanove, lekare). Исключение: braća → braću.');
  if(r.c==='A'&&r.num==='s'&&g==='ma')out.push('М.р. на -a: В.п. на -u, как у ж.р. (vidim komšiju), хотя слово мужского рода и одушевлённое.');
  (CD.nouns[r.n].x||[]).forEach(([cs,nm,t])=>{if(cs.includes(r.c)&&nm.includes(r.num))out.push(t)});
  return out}

   <li><b>Беглое a</b>: <span lang="sr-Latn">centar → ${sw('centr|a','G')}</span>, <span lang="sr-Latn">posao → ${sw('posl|a','G')}</span>, <span lang="sr-Latn">novac → ${sw('novc|a','G')}</span>.</li>
   <li><b>М.р. на -a</b> (komšija, tata, sudija) склоняются как женский род: <span lang="sr-Latn">kod ${sw('komšij|e','G')}</span>.</li>
   <li><b>Творительный на -em</b>, два разных случая. 1) М.р. на шипящую или мягкую (č, ć, š, ž, đ, dž, lj, nj, j): <span lang="sr-Latn">ključ → ${sw('ključ|em','I')}</span>, <span lang="sr-Latn">muž → ${sw('muž|em','I')}</span>, <span lang="sr-Latn">prijatelj → ${sw('prijatelj|em','I')}</span>. На -c по-разному: <span lang="sr-Latn">novac → novcem, otac → ocem</span>, но <span lang="sr-Latn">zec → zecom</span>. 2) Ср.р. на -e <i>без расширения основы</i>: <span lang="sr-Latn">more → ${sw('mor|em','I')}</span>, <span lang="sr-Latn">polje → ${sw('polj|em','I')}</span>, <span lang="sr-Latn">dvorište → ${sw('dvorišt|em','I')}</span>. С расширением -en- — на -om: <span lang="sr-Latn">ime → imenom, vreme → vremenom, seme → semenom, rame → ramenom</span>; с -et-: <span lang="sr-Latn">dete → detetom</span>. Ср.р. на -o — на -om: <span lang="sr-Latn">selo → ${sw('sel|om','I')}</span>.</li>
   <li><b>sa (s) с двумя падежами</b>: <span lang="sr-Latn">sa ${sw('prijatelj|em','I')}</span> — с другом (Т.п., вместе с); <span lang="sr-Latn">sa ${sw('posl|a','G')}</span> — с работы (Р.п., откуда).</li>
   <li><b>Д.п. и М.п.</b> по форме всегда одинаковы: <span lang="sr-Latn">pišem ${sw('mam|i','D')}</span> — <span lang="sr-Latn">mislim o ${sw('mam|i','L')}</span>. Отличает предлог.</li>
  </ul></section>
  <button class="ghost" data-cact="home">Назад</button></div>`;
  window.scrollTo(0,0);
}

/* изучение */
let cst=null;
/* пример для любой формы: сначала настоящая фраза из изучения, иначе простая заготовка */
const RI={N:0,G:1,D:2,A:3,L:4,I:5};
function exampleFor(nk,c,m){
  const own=CSTUDY.find(r=>r.n===nk&&r.c===c&&r.num===m);if(own)return own;
  const n=CD.nouns[nk],w=n.f[m][c].join(''),rw=(n.rf[m]&&n.rf[m].length?n.rf[m]:n.rf.s)[RI[c]],p=m==='p';
  const ob=/^[аоуэиАОУЭИ]/.test(rw)?'об':'о';let s,ru;
  if(c==='N'){s=(p?'Ovo su':'Ovo je')+' ['+w+'].';ru='Это '+rw+'.'}
  else if(c==='G'){s='Nema ['+w+'].';ru='Нет '+rw+'.'}
  else if(c==='D'){if(n.an){s='Pišem ['+w+'].';ru='Пишу '+rw+'.'}else if(n.pl){s='Idem ka ['+w+'].';ru='Иду к '+rw+'.'}else{s='Radujem se ['+w+'].';ru='Радуюсь '+rw+'.'}}
  else if(c==='A'){s='Vidim ['+w+'].';ru='Вижу '+rw+'.'}
  else if(c==='L'){s='Pričam o ['+w+'].';ru='Говорю '+ob+' '+rw+'.'}
  else {if(n.an){s='Razgovaram sa ['+w+'].';ru='Разговариваю с '+rw+'.'}else{s='Zadovoljna sam ['+w+'].';ru='Я довольна '+rw+'.'}}
  return {s,n:nk,c,num:m,ru,th:''}}
function caseStudy(){let q=cFilter(CSTUDY);if(S.ord==='mix')q=shuffle(q.slice());if(!q.length)return;run=null;cst={q,i:0};cCard()}
function cCard(keep){const r0=cst.q[cst.i],r=cst.v||r0,N=cst.q.length;
  app.innerHTML=`<div class="wrap study">
  <div class="qtop"><button class="x" data-cact="home" aria-label="Выйти">×</button>
   <div class="pr"><div class="lbl"><span>Падежи · ${esc(r0.th)}</span><span>${cst.i+1} / ${N}</span></div><div class="bar"><i style="width:${(cst.i/N*100).toFixed(1)}%"></i></div></div></div>
  <div class="ccard">${badges(r)}
   <div class="csent" lang="sr-Latn">${sentHTML(r)}</div>
   <div class="ctr" lang="ru">${esc(r.ru)}</div>
   <div class="crule"><b>${CM[r.c].q}</b>${ruleOf(r).map(t=>`<p>${esc(t)}</p>`).join('')}</div>
   ${declTable(r,1)}
   <p class="taphint">${cst.v?'<button class="link" data-cact="back0">← вернуться к исходной фразе</button>':'Нажми на любую форму в таблице — покажу её падеж, пример и правило'}</p>
  </div>
  <div class="ctrl"><button class="cb" data-cact="prev" aria-label="Назад" ${cst.i?'':'disabled'}>${PREV}</button>
   <button class="primary grow" data-cact="next">${cst.i+1<N?'Дальше':'Готово'}</button></div></div>`;
  if(keep){const c=app.querySelector('.ccard');if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({behavior:'smooth'})}else window.scrollTo(0,0);
}

/* проверка */
let cr=null;
/* пары «куда или где» превращаем в обычные фразы с пометкой */
const numOf=(nk,c,s)=>{const w=s.slice(s.indexOf('[')+1,s.indexOf(']')).toLowerCase(),f=CD.nouns[nk].f;return f.p&&f.p[c].join('').toLowerCase()===w&&f.s[c].join('').toLowerCase()!==w?'p':'s'};
const PROWS=[];CD.pairs.forEach(([a,ra,b,rb,n],i)=>{const A={s:a,n,c:'A',num:numOf(n,'A',a),ru:ra,th:'',pi:i},L={s:b,n,c:'L',num:numOf(n,'L',b),ru:rb,th:'',pi:i};A.mate=L;L.mate=A;PROWS.push(A,L)});
const VB=CD.verbs.map(([v,ru,c,p,ex,exr])=>({v,ru,c,p,ex,exr,key:'verb:'+v}));
const VOPT=[['G',''],['D',''],['A',''],['L','o'],['I','sa'],['I','']];
const vBase=v=>v.p&&v.v.endsWith(' '+v.p)?v.v.slice(0,-v.p.length-1):v.v;
const vLabel=(c,p)=>(p?p+' + ':'+ ')+CM[c].sr;
function cErrItems(){const out=[];
  CSTUDY.concat(CTEST).forEach(r=>{if(S.cs.e[r.s])out.push({t:'row',r})});
  PROWS.forEach(r=>{if(S.cs.e['pair:'+r.s])out.push({t:'pair',r})});
  VB.forEach(v=>{if(S.cs.e[v.key])out.push({t:'verb',v})});return out}
function caseTest(list,title){if(!list.length)return;st=null;cst=null;
  cr={q:list,i:0,ok:0,bad:[],title:title||'Падежи'};cQ()}
const capOf=r=>/^[A-ZČĆĐŠŽ]/.test(r.s.slice(r.s.indexOf('[')+1));
const rightOf=r=>{const w=formOf(r).join('');return capOf(r)?w[0].toUpperCase()+w.slice(1):w};
function cOpts(r){const n=CD.nouns[r.n],right=formOf(r).join('');
  const same=[],other=[];for(const m of ['s','p'])if(n.f[m])for(const c of CK){const w=n.f[m][c].join('');if(w.toLowerCase()===right.toLowerCase())continue;(m===r.num?same:other).push(w)}
  const uniq=a=>[...new Set(a)];let o=shuffle(uniq(same)).slice(0,3);
  if(o.length<3)o=o.concat(shuffle(uniq(other).filter(w=>!o.includes(w))).slice(0,3-o.length));
  const fix=w=>capOf(r)?w[0].toUpperCase()+w.slice(1):w;
  return shuffle(o.concat([right]).map(fix))}
const typing=()=>S.cs.inp==='type';
function qTop(){const N=cr.q.length;return `<div class="qtop"><button class="x" data-cact="home" aria-label="Выйти">×</button>
   <div class="pr"><div class="lbl"><span>${esc(cr.title)}</span><span>${cr.i+1} / ${N}</span></div><div class="bar"><i style="width:${(cr.i/N*100).toFixed(1)}%"></i></div></div></div>`}
const typeBox=()=>`<form class="tbox" id="tf" autocomplete="off"><input id="ti" lang="sr-Latn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Напиши форму слова" enterkeyhint="done"><button class="primary" type="submit">Проверить</button></form>
  <div class="dia">${['č','ć','đ','š','ž'].map(c=>`<button type="button" data-ins="${c}">${c}</button>`).join('')}</div>`;
function cQ(){const it=cr.q[cr.i];
  if(it.t==='verb'){const v=it.v,opts=shuffle(VOPT.slice());
    cr.cur={it,kind:'verb',opts,ok:opts.findIndex(([c,p])=>c===v.c&&p===v.p),done:false};
    app.innerHTML=`<div class="wrap">${qTop()}
    <div class="card"><span class="flag">Какой падеж нужен после глагола?</span>
     <div class="csent" lang="sr-Latn">${esc(vBase(v))} <span class="gap">&nbsp;</span></div><div class="ctr">${esc(v.ru.replace(/ (о|с)$/,''))}</div></div>
    <div class="opts copts">${opts.map(([c,p],k)=>`<button class="opt k${c}" data-copt="${k}"><i class="dot"></i><span class="cn"><span lang="sr-Latn">${esc(vLabel(c,p))}</span><small>${CM[c].ru} · ${CM[c].q}</small></span></button>`).join('')}</div>
    <div id="cx"></div></div>`;window.scrollTo(0,0);return}
  const r=it.r,n=CD.nouns[r.n],pair=it.t==='pair';
  const kind=pair?'pair':(S.cs.qt==='mix'?(Math.random()<.5?'end':'case'):S.cs.qt);
  const typed=typing()&&kind!=='case';
  let opts=[],ok=-1;
  if(!typed){if(kind==='end')opts=cOpts(r);else if(kind==='case')opts=CK.slice();
    else{const a=r.c==='A'?r:r.mate,l=r.c==='L'?r:r.mate;opts=shuffle([rightOf(a),rightOf(l)].map(w=>capOf(r)?w[0].toUpperCase()+w.slice(1):w.toLowerCase()===w?w:w))}
    ok=kind==='case'?CK.indexOf(r.c):opts.indexOf(rightOf(r))}
  cr.cur={it,r,kind,typed,opts,ok,done:false};
  const flag=kind==='case'?'Какой это падеж?':kind==='pair'?'Куда или где?':'Вставь нужную форму';
  app.innerHTML=`<div class="wrap">${qTop()}
  <div class="card"><span class="flag">${flag}</span>
   <div class="csent q" lang="sr-Latn">${sentHTML(r,kind==='case'?'plain':'blank')}</div>
   ${kind!=='case'?`<div class="hintw" lang="sr-Latn">${esc(n.f.s.N.join(''))} <span lang="ru">— ${esc(n.ru)}</span></div>`:''}
   <div class="ctr" lang="ru">${esc(r.ru)}</div></div>
  ${typed?typeBox():`<div class="opts${kind==='case'?' copts':''}">${opts.map((o,k)=>kind==='case'?`<button class="opt k${o}" data-copt="${k}"><i class="dot"></i><span class="cn">${CM[o].ru} <span class="srn" lang="sr-Latn">${CM[o].sr}</span><small>${CM[o].q}</small></span></button>`:`<button class="opt" data-copt="${k}" lang="sr-Latn">${esc(o)}</button>`).join('')}</div>`}
  <div id="cx"></div></div>`;
  window.scrollTo(0,0);
  if(typed){const f=document.getElementById('tf');f.addEventListener('submit',e=>{e.preventDefault();cType()});setTimeout(()=>{const i=document.getElementById('ti');i&&i.focus({preventScroll:true})},50)}
}
const plainLat=s=>s.toLowerCase().replace(/đ/g,'dj').replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').trim();
function cType(){const c=cr.cur;if(!c||c.done)return;const inp=document.getElementById('ti');const v=(inp.value||'').trim();if(!v){inp.focus();return}
  const want=rightOf(c.r);let res;
  if(v.toLowerCase()===want.toLowerCase())res='ok';else if(plainLat(v)===plainLat(want))res='almost';else res='no';
  inp.readOnly=true;inp.classList.add(res==='no'?'no':'ok');app.querySelector('#tf button').disabled=true;
  finish(res!=='no',res==='almost'?`Засчитано, но пиши с диакритикой: <b lang="sr-Latn">${esc(want)}</b>`:res==='no'?`Правильно: <b lang="sr-Latn">${esc(want)}</b>`:'')}
function cPick(k){const c=cr.cur;if(!c||c.done||c.typed)return;const right=k===c.ok;
  const btns=app.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);btns[c.ok].classList.add('ok');if(!right)btns[k].classList.add('no');
  finish(right,'')}
function errKey(it){return it.t==='verb'?it.v.key:it.t==='pair'?'pair:'+it.r.s:it.r.s}
function pairCard(r){const a=r.c==='A'?r:r.mate,l=r.c==='L'?r:r.mate;
  return `<div class="pairc">${[a,l].map(x=>`<div class="pc k${x.c}${x===r?' me':''}"><span class="cbadge k${x.c}">${x.c==='A'?'куда?':'где?'} · ${CM[x.c].sr}</span><div class="csent sm" lang="sr-Latn">${sentHTML(x)}</div><div class="ctr">${esc(x.ru)}</div></div>`).join('')}
  <p class="mini-n">u / na + куда? → Akuzativ (идёшь туда) · u / na + где? → Lokativ (уже там)</p></div>`}
function finish(right,note){const c=cr.cur;c.done=true;const it=c.it,key=errKey(it);
  if(right){cr.ok++;delete S.cs.e[key]}else{S.cs.e[key]=1;cr.bad.push(it)}save();
  let body;
  if(it.t==='verb'){const v=it.v;body=`<div class="ccard ex"><div class="badges"><span class="cbadge k${v.c}">${CM[v.c].ru} · ${CM[v.c].sr}</span></div>
     <div class="cfrom" lang="sr-Latn">${esc(vBase(v))} ${esc(vLabel(v.c,v.p))} <em lang="ru">${esc(v.ru)} ${CM[v.c].q}</em></div>
     <div class="crule"><b lang="sr-Latn">${esc(v.ex)}</b><p>${esc(v.exr)}</p></div></div>`;
    const s=app.querySelector('.csent .gap');if(s)s.outerHTML=`<b class="end k${v.c}">${esc(vLabel(v.c,v.p))}</b>`}
  else{const s=app.querySelector('.csent.q');if(s)s.innerHTML=sentHTML(c.r);
    body=`<div class="ccard ex">${it.t==='pair'?pairCard(c.r):explain(c.r)}</div>`}
  document.getElementById('cx').innerHTML=`<div class="verdict ${right?'fast':'wrong'}">${right?'Верно':'Неверно · ушло в ошибки'}</div>
   ${note?`<p class="tnote">${note}</p>`:''}${body}
   <button class="primary" data-cact="qnext" style="width:100%">${cr.i+1<cr.q.length?'Дальше':'Итоги'}</button>`;
  setTimeout(()=>{const b=document.querySelector('[data-cact="qnext"]');b&&b.focus({preventScroll:true})},30);
}
function cRes(){const N=cr.q.length,x=cr.bad.length,ne=cErrItems().length,bad=cr.bad;
  app.innerHTML=`<div class="wrap"><header><h1>${x?'Проверка пройдена':'Без единой ошибки!'}</h1><p class="sub">${N} ${plural(N,'вопрос','вопроса','вопросов')} · ${esc(cr.title)}</p></header>
  <div class="big3 two"><div class="g"><b>${cr.ok}</b><span>верно</span></div><div class="r"><b>${x}</b><span>ошибки</span></div></div>
  <div class="btns">${ne?`<button class="primary" data-cact="errors">Работа над ошибками · ${ne}</button>`:''}
   <button class="ghost" data-cact="again">Ещё раз такую же тренировку</button><button class="ghost" data-cact="home">На главную</button></div>
  ${x?`<div class="block"><h2>Повторить</h2><div class="list">${bad.map(it=>it.t==='verb'?`<div><span class="s" lang="sr-Latn">${esc(vBase(it.v))} ${esc(vLabel(it.v.c,it.v.p))}</span><span class="r">${esc(it.v.ru)} · ${esc(it.v.ex)}</span></div>`:`<div><span class="s" lang="sr-Latn">${sentHTML(it.r)}</span><span class="r">${CM[it.r.c].ru} (${CM[it.r.c].sr})${it.r.num==='p'?', мн.ч.':''} · ${esc(it.r.ru)}</span></div>`).join('')}</div></div>`:''}</div>`;
  cLast=cr.mode;cr=null;window.scrollTo(0,0);
}
let cLast='test';
function startMode(m){const lim=a=>S.cs.size==='all'?a:a.slice(0,S.cs.size);let q,t;
  if(m==='pairs'){q=lim(shuffle(PROWS.slice())).map(r=>({t:'pair',r}));t='Куда или где?'}
  else if(m==='verbs'){q=lim(shuffle(VB.slice())).map(v=>({t:'verb',v}));t='Глаголы и выражения'}
  else if(m==='errors'){q=shuffle(cErrItems());t='Работа над ошибками'}
  else{q=lim(shuffle(cFilter(CTEST).slice())).map(r=>({t:'row',r}));t='Падежи'}
  caseTest(q,t);if(cr)cr.mode=m}
function caseClick(b){const d=b.dataset;
  if(d.cc){const on=new Set(S.cs.on);on.has(d.cc)?on.delete(d.cc):on.add(d.cc);if(!on.size)on.add(d.cc);S.cs.on=CK.filter(c=>on.has(c));save();casesHome();return true}
  if(d.cnum){S.cs.num=d.cnum;save();casesHome();return true}
  if(d.cqt){S.cs.qt=d.cqt;save();casesHome();return true}
  if(d.cinp){S.cs.inp=d.cinp;save();casesHome();return true}
  if(d.csize){S.cs.size=d.csize==='all'?'all':+d.csize;save();casesHome();return true}
  if(d.copt!==undefined&&cr){cPick(+d.copt);return true}
  if(d.ins&&cr){const i=document.getElementById('ti');if(i&&!i.readOnly){const a=i.selectionStart??i.value.length,z=i.selectionEnd??a;i.value=i.value.slice(0,a)+d.ins+i.value.slice(z);i.focus();i.setSelectionRange(a+1,a+1)}return true}
  if(d.cform&&cst){const [c,m]=d.cform.split('|'),r0=cst.q[cst.i];cst.v=(c===r0.c&&m===r0.num)?null:exampleFor(r0.n,c,m);cCard(1);return true}
  const a=d.cact;if(!a)return false;
  if(a==='sheet')caseSheet();
  else if(a==='encsheet')encSheet();
  else if(a==='home'){cst=null;cr=null;casesHome();window.scrollTo(0,0)}
  else if(a==='study')caseStudy();
  else if(a==='prev'&&cst){cst.v=null;cst.i=Math.max(0,cst.i-1);cCard()}
  else if(a==='back0'&&cst){cst.v=null;cCard(1)}
  else if(a==='next'&&cst){cst.v=null;cst.i++;if(cst.i>=cst.q.length){cst=null;casesHome()}else cCard()}
  else if(a==='test'||a==='pairs'||a==='verbs'||a==='errors')startMode(a);
  else if(a==='again')startMode(cLast==='errors'?'test':cLast);
  else if(a==='qnext'&&cr){cr.i++;cr.i>=cr.q.length?cRes():cQ()}
  return true}
document.addEventListener('keydown',e=>{if(!cr||!cr.cur)return;if(e.target&&e.target.tagName==='INPUT')return;const n=cr.cur.opts.length;if(/^[1-6]$/.test(e.key)&&+e.key<=n&&!cr.cur.done&&!cr.cur.typed)cPick(+e.key-1);else if(e.key==='Enter'&&cr.cur.done){e.preventDefault();cr.i++;cr.i>=cr.q.length?cRes():cQ()}});

home();
})();

</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
