<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2347C5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Сербский тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column; home = settings stack, quiz = word card + 4 big answer buttons */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151A2C; --muted:#5C6378; --line:#DCE1EB;
  --accent:#2347C5; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --cyr:#B4441F;
  --good:#1B8A57; --good-soft:#DDF3E8; --bad:#C2372C; --bad-soft:#FBE3E0; --warn:#A86A00; --warn-soft:#FBEFD6;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F121B; --surface:#181C29; --ink:#E8EBF3; --muted:#9AA1B6; --line:#2A3042;
  --accent:#7D96FF; --accent-ink:#0F121B; --accent-soft:#232C4D; --cyr:#FF9B73;
  --good:#46C384; --good-soft:#163527; --bad:#F07565; --bad-soft:#3D1D1A; --warn:#E6AE45; --warn-soft:#3A2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F121B; --surface:#181C29; --ink:#E8EBF3; --muted:#9AA1B6; --line:#2A3042;
  --accent:#7D96FF; --accent-ink:#0F121B; --accent-soft:#232C4D; --cyr:#FF9B73;
  --good:#46C384; --good-soft:#163527; --bad:#F07565; --bad-soft:#3D1D1A; --warn:#E6AE45; --warn-soft:#3A2C12; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%;box-sizing:border-box}
h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.block{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg.c4{grid-template-columns:repeat(4,1fr)} .seg.c5{grid-template-columns:repeat(5,1fr)}
.len button{font-size:13px;padding:8px 4px}.len small{display:block;font-weight:400;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.trow{display:flex;flex-direction:column;gap:4px}.trow>span{font-size:13px;color:var(--ink)} .seg.c3{grid-template-columns:repeat(3,1fr)} .copts{gap:7px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;font-size:15px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dir small{display:block;font-weight:400;font-size:12px;opacity:.8}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;min-height:56px}
.primary.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 6px 18px rgba(20,30,70,.18)}
.picked{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px}.picked span{color:var(--muted);font-size:13px}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}
.errcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:14px}
.errcard .n{font-family:var(--display);font-size:28px;color:var(--bad);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.errcard .t{flex:1;min-width:0}
.errcard .t b{display:block}
.errcard .t span{color:var(--muted);font-size:13px}
.errcard button{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.errcard.empty{border-left-color:var(--good)} .errcard.empty .n{color:var(--good)}
.stats{display:flex;gap:8px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0}
.groups{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{border-top:1px solid var(--line)} .grp:first-child{border-top:0}
.grp summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:44px}
.grp summary::-webkit-details-marker{display:none}
.grp summary .nm{flex:1;min-width:0;font-weight:600}
.grp summary .cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grp summary .chev{color:var(--muted);transition:transform .2s}
.grp[open] summary .chev{transform:rotate(90deg)}
.themes{display:flex;flex-direction:column;padding:0 14px 10px 44px;gap:2px}
label.ck{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
label.ck input{position:absolute;opacity:0;width:1px;height:1px}
label.ck span.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
label.ck input:checked+span.box{background:var(--accent);border-color:var(--accent)}
label.ck input:checked+span.box::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
label.ck input:indeterminate+span.box{background:var(--accent-soft);border-color:var(--accent)}
label.ck input:indeterminate+span.box::after{content:"";width:10px;height:2.5px;background:var(--accent)}
label.ck .lt{flex:1;min-width:0;font-size:15px}
label.ck .lc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.switch .lt{flex:1;min-width:0}
.switch .lt small{display:block;color:var(--muted);font-size:13px}
.tg{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input{position:absolute;opacity:0}
.switch input:checked+.tg{background:var(--accent)}
.switch input:checked+.tg::after{transform:translateX(18px)}
.foot{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;margin-top:auto}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.qtop .pr{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qtop .pr .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .pr .bar i{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.card .th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .w{font-size:clamp(24px,7.5vw,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.card .w.long{font-size:clamp(19px,5.4vw,24px)}
.timer{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;transform:scaleX(1)}
.timer.run i{animation:drain var(--thr) linear forwards}
.timer.over i{background:var(--warn)}
@keyframes drain{to{transform:scaleX(0)}}
.flag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:17px;min-height:58px;font-weight:500;overflow-wrap:anywhere;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.verdict{min-height:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.verdict.fast{color:var(--good)} .verdict.slow{color:var(--warn)} .verdict.wrong{color:var(--bad)}
/* results */
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.big3 b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.big3 span{font-size:12px;color:var(--muted)}
.big3 .g b{color:var(--good)} .big3 .s b{color:var(--warn)} .big3 .r b{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.list div{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.list div:first-child{border-top:0}
.list .s{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.list .r{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.btns{display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm .row button{flex:1}
.danger{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700}

.move{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.move textarea{width:100%;box-sizing:border-box;font:13px/1.3 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.mvmsg{margin:0;font-weight:600;color:var(--ink)}
.wrow{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%}
.wrow .w{min-width:0}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.qtop .snd{display:grid;place-items:center;color:var(--accent)}
.qtop .snd[aria-pressed="false"]{color:var(--muted)}
.sayans{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent)}
/* изучение */
.modes{grid-template-columns:1fr 1fr}
.hint{margin:0;color:var(--muted);font-size:14px}
.study{min-height:100%}
.scard{flex:1;min-height:52vh;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer}
.scard .th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scard .pic{width:clamp(130px,44vw,190px);height:auto;aspect-ratio:1;object-fit:contain;max-width:100%}
.scard .sw{font-size:clamp(30px,9vw,44px);font-weight:700;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance}
.scard .sw.long{font-size:clamp(22px,6.4vw,30px)}
.scard .cy{font-size:clamp(22px,6.4vw,32px);font-weight:600;color:var(--cyr);line-height:1.2;overflow-wrap:anywhere;text-wrap:balance;margin-top:-6px}
.scard .fm{font-size:clamp(16px,4.6vw,21px);font-weight:600;color:var(--muted);line-height:1.3;margin-top:-4px;text-wrap:balance}
.scard{position:relative}
.asp{position:absolute;top:12px;right:12px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;opacity:.85;line-height:1.3}
.has-asp .th{margin-top:22px}
.asp-impf{color:var(--accent)}
.asp-pf{color:#2E8B57}
.asp-both{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .asp-pf{color:#6FD39A}}
:root[data-theme="dark"] .asp-pf{color:#6FD39A}
.scard .cj{font-size:.36em;font-weight:500;color:var(--muted);margin-left:.35em;vertical-align:.45em;letter-spacing:.02em}
.scard .pn{font-weight:500;opacity:.6;font-size:.82em}
.scard .cyf{font-size:clamp(14px,4vw,18px);font-weight:600;color:var(--cyr);opacity:.85;line-height:1.3;margin-top:-6px;text-wrap:balance}
.st{position:relative;display:inline-block}
.st::after{content:"";position:absolute;left:50%;top:-.02em;width:.34em;height:.085em;min-height:2px;border-radius:2px;background:#E5352B;transform:translateX(-40%) rotate(-28deg)}
.scard .cy.long{font-size:clamp(17px,4.8vw,22px)}
.scard .tr{font-size:clamp(20px,5.6vw,26px);color:var(--accent);font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;overflow-wrap:anywhere}
.scard .tr.on{opacity:1;transform:none}
.ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.cb{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.cb.main{width:72px;height:72px;background:var(--accent);color:var(--accent-ink);border:0}
.cb:disabled{opacity:.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.timer.run i{animation:none;transform:scaleX(1)}}

/* ===== компактный вид ===== */
body{font-size:15px}
.wrap{gap:14px;padding-block:14px 24px}
.wrap.home{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h2{font-size:11px;letter-spacing:.08em;font-weight:600}
.top{display:flex;flex-direction:column;gap:8px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl h1{font-size:19px}
.stat{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0 9px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hint{font-size:13px}
.seg.sm{border-radius:10px;padding:3px;gap:2px}
.seg.sm button{min-height:34px;padding:6px 8px;font-size:13.5px;border-radius:8px;font-weight:600}
.seg button[aria-pressed="false"]{color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);min-height:32px}
.chips button small{font-weight:400;opacity:.75;font-variant-numeric:tabular-nums;margin-left:2px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.errcard{padding:9px 10px 9px 14px;gap:10px;border-radius:12px;border-left-width:3px;align-items:center}
.errcard .n{font-size:20px;min-width:auto}
.errcard .t{flex:1;font-size:14px;color:var(--muted)}
.errcard button{padding:7px 12px;font-size:13.5px;border-radius:9px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:28px;position:relative;cursor:default}
.li:first-child{border-top:0}
label.li{cursor:pointer}
.li .lt{font-size:14.5px;flex:1;min-width:0}
.li input{position:absolute;opacity:0;width:1px;height:1px}
.li .tg{width:38px;height:22px;border-radius:11px}
.li .tg::after{width:16px;height:16px}
.li input:checked+.tg{background:var(--accent)}
.li input:checked+.tg::after{transform:translateX(16px)}
.li input:focus-visible+.tg{outline:3px solid var(--accent);outline-offset:2px}
.mini{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px;flex-wrap:wrap;justify-content:flex-end}
.mini button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted);min-height:28px}
.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.settings{border-top:1px solid var(--line);padding-top:4px}
.settings summary{list-style:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"›";transition:transform .2s;font-size:18px;line-height:1}
.settings[open] summary::after{transform:rotate(90deg)}
.setin{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.setin .block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 0 2px;gap:2px}
.setin .block h2{padding:0 12px 4px}
.setin .link{align-self:flex-start;font-size:14px;padding:2px 0}
.danger-link{color:var(--bad)!important}
.note{margin:0;font-size:12px;color:var(--muted)}
.picked{margin:0;font-size:13px;color:var(--muted);background:none;padding:0}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta .primary{display:block;width:100%;max-width:520px;margin:0 auto;min-height:48px;padding:12px;font-size:15.5px;border-radius:12px;box-shadow:0 6px 16px rgba(20,30,70,.18)}
.grp summary{padding:10px 12px;min-height:0}
.grp summary .nm{font-size:14.5px}
.themes{padding:0 12px 8px 14px}
label.ck{padding:5px 0}
label.ck .lt{font-size:14px}
label.ck span.box{width:19px;height:19px;border-radius:5px}
.groups{border-radius:12px}
/* тест */
.qtop .x{width:38px;height:38px;border-radius:10px;font-size:17px}
.card{padding:16px 14px 14px;border-radius:16px;gap:10px}
.card .w{font-size:clamp(22px,6.6vw,30px)}
.say{width:38px;height:38px}
.opts{gap:8px}
.opt{border-width:1.5px;border-radius:12px;padding:11px 14px;min-height:48px;font-size:16px}
.flag{font-size:11.5px}
.verdict{font-size:14px;min-height:20px}
.primary{min-height:48px;padding:12px;font-size:15.5px;border-radius:12px}
.ghost{padding:9px 14px;font-size:14px;border-radius:10px}
.big3 b{font-size:22px}
.big3 div{padding:10px 6px;border-radius:12px}
/* изучение */
.scard{border-radius:20px;padding:20px 16px;min-height:48vh}
.cb{width:48px;height:48px}.cb.main{width:62px;height:62px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:0}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;margin:0;font-size:15px;font-weight:700;color:var(--muted);min-height:44px}

/* ---------- Падежи ---------- */

let run=null,timers=[];

function options(w){
  const ans=x=>run.dir==='sr'?x.ru:x.sr;
  const right=ans(w), norm=s=>s.toLowerCase().replace(/[.!?,…]/g,'').trim();
  const r=rec(run.dir,w.key), prev=(r.d||[]).filter(p=>norm(p)!==norm(right));
  const used=new Set([norm(right)]);const out=[];
  // на повторе: часть прошлых вариантов остаётся (случайно 0–3), остальные заменяются новыми
  if(prev.length){
    const change=[0,1,1,2,2,3][Math.floor(Math.random()*6)];
    for(const p of shuffle(prev.slice()).slice(0,Math.max(0,3-change))){used.add(norm(p));out.push(p)}
    prev.forEach(p=>used.add(norm(p)));
  }
  const tryFrom=list=>{for(const x of shuffle(list.slice())){if(out.length>=3)return;const a=ans(x);if(used.has(norm(a)))continue;used.add(norm(a));out.push(a)}};
  tryFrom(DATA[w.gi].t[w.ti].w.map(([sr,ru])=>({sr,ru})));
  if(out.length<3)tryFrom(W.filter(x=>x.gi===w.gi&&x.b===w.b));
  if(out.length<3)tryFrom(W.filter(x=>x.gi===w.gi));
  if(out.length<3)tryFrom(W);
  r.d=out.slice(0,3);
  const opts=shuffle([right,...out.slice(0,3)]);
  return {opts,ok:opts.indexOf(right)};
}
function show(){
  clearT();
  const w=run.q[run.i];const {opts,ok}=options(w);run.cur={w,opts,ok,done:false};

  app.innerHTML=`<div class="wrap">

   <div class="verdict" id="vd" aria-live="polite"></div><div id="nx"></div></div>`;
  const cur=run.cur;
  const go=()=>{if(!run||run.cur!==cur||cur.done)return;run.t0=performance.now();const tm=document.getElementById('tm');if(tm){tm.classList.add('run');timers.push(setTimeout(()=>tm.classList.add('over'),thrOf(w)*1000))}};

function pick(k){
  const c=run.cur;if(!c||c.done)return;c.done=true;clearT();
  const t=run.t0?performance.now()-run.t0:0;
  const right=k===c.ok, fast=right&&t<=thrOf(c.w)*1000;
  const r=rec(run.dir,c.w.key);
  let res;
  if(fast){r.k=1;r.e=0;r.s=0;res='fast'}
  else if(right){r.k=0;r.s=(r.s||0)+1;r.e=r.s>=7?0:1;res='slow'}
  else{r.k=0;r.e=1;r.s=0;r.w=(r.w||0)+1;res='wrong'}
  save();
  run.res.push({w:c.w,res,t});
  const btns=app.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  btns[c.ok].classList.add('ok');if(!right)btns[k].classList.add('no');
  const tm=document.getElementById('tm');if(tm){tm.classList.remove('run');tm.style.visibility='hidden'}
  const vd=document.getElementById('vd');
  if(res==='fast'){vd.className='verdict fast';vd.textContent='Верно · '+sec(t)}
  else if(res==='slow'){vd.className='verdict slow';vd.textContent='Верно, но медленно ('+sec(t).replace(' с','')+' из '+String(thrOf(c.w)).replace('.',',')+' с)'+(r.e?' · повторим':' · уже 7 раз, хватит')}
  else{vd.className='verdict wrong';vd.textContent='Неверно · слово ушло в ошибки'}
  const sayAns=S.voice&&run.dir==='ru'&&canSay(c.w);
  if(run.dir==='ru'&&canSay(c.w))document.getElementById('nx').insertAdjacentHTML('beforebegin','<button class="ghost sayans" data-act="say">'+SPK+'<span>Послушать: '+esc(c.w.sr)+'</span></button>');
  if(right){if(sayAns){const me=c;sayWord(c.w,()=>{if(run&&run.cur===me)timers.push(setTimeout(next,400))})}else timers.push(setTimeout(next,res==='fast'?650:1100))}
  else{if(sayAns)sayWord(c.w);document.getElementById('nx').innerHTML='<button class="primary" data-act="next" style="width:100%">Дальше</button>';document.querySelector('[data-act="next"]').focus({preventScroll:true})}
}

async function runCard(w){
  const tok=++st.tok, me=st, ok=()=>st===me&&st.tok===tok&&st.play;

  if(snd){
    await wait(300);if(!ok())return;
    const ch=w.fm?await loadF(w).then(j=>!!(j.f||{})[w.sr]):false;if(!ok())return;
    await new Promise(r=>sayWord(w,r,ch));if(!ok())return;

    if(w.g!=='Прилагательные'&&!ch){await wait(700);if(!ok())return;
    await new Promise(r=>sayWord(w,r));if(!ok())return;}
    await wait(600);if(!ok())return;

function cOpts(r){const n=CD.nouns[r.n],right=formOf(r).join('');
  const same=[],other=[];for(const m of ['s','p'])if(n.f[m])for(const c of CK){const w=n.f[m][c].join('');if(w.toLowerCase()===right.toLowerCase())continue;(m===r.num?same:other).push(w)}
  const uniq=a=>[...new Set(a)];let o=shuffle(uniq(same)).slice(0,3);
  if(o.length<3)o=o.concat(shuffle(uniq(other).filter(w=>!o.includes(w))).slice(0,3-o.length));
  const fix=w=>capOf(r)?w[0].toUpperCase()+w.slice(1):w;
  return shuffle(o.concat([right]).map(fix))}
const typing=()=>S.cs.inp==='type';
function qTop(){const N=cr.q.length;return `<div class="qtop"><button class="x" data-cact="home" aria-label="Выйти">×</button>
   <div class="pr"><div class="lbl"><span>${esc(cr.title)}</span><span>${cr.i+1} / ${N}</span></div><div class="bar"><i style="width:${(cr.i/N*100).toFixed(1)}%"></i></div></div></div>`}
const typeBox=()=>`<form class="tbox" id="tf" autocomplete="off"><input id="ti" lang="sr-Latn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Напиши форму слова" enterkeyhint="done"><button class="primary" type="submit">Проверить</button></form>
  <div class="dia">${['č','ć','đ','š','ž'].map(c=>`<button type="button" data-ins="${c}">${c}</button>`).join('')}</div>`;
function cQ(){const it=cr.q[cr.i];
  if(it.t==='verb'){const v=it.v,opts=shuffle(VOPT.slice());
    cr.cur={it,kind:'verb',opts,ok:opts.findIndex(([c,p])=>c===v.c&&p===v.p),done:false};
    app.innerHTML=`<div class="wrap">${qTop()}
    <div class="card"><span class="flag">Какой падеж нужен после глагола?</span>
     <div class="csent" lang="sr-Latn">${esc(vBase(v))} <span class="gap">&nbsp;</span></div><div class="ctr">${esc(v.ru.replace(/ (о|с)$/,''))}</div></div>
    <div class="opts copts">${opts.map(([c,p],k)=>`<button class="opt k${c}" data-copt="${k}"><i class="dot"></i><span class="cn"><span lang="sr-Latn">${esc(vLabel(c,p))}</span><small>${CM[c].ru} · ${CM[c].q}</small></span></button>`).join('')}</div>
    <div id="cx"></div></div>`;window.scrollTo(0,0);return}
  const r=it.r,n=CD.nouns[r.n],pair=it.t==='pair';
  const kind=pair?'pair':(S.cs.qt==='mix'?(Math.random()<.5?'end':'case'):S.cs.qt);
  const typed=typing()&&kind!=='case';
  let opts=[],ok=-1;
  if(!typed){if(kind==='end')opts=cOpts(r);else if(kind==='case')opts=CK.slice();
    else{const a=r.c==='A'?r:r.mate,l=r.c==='L'?r:r.mate;opts=shuffle([rightOf(a),rightOf(l)].map(w=>capOf(r)?w[0].toUpperCase()+w.slice(1):w.toLowerCase()===w?w:w))}
    ok=kind==='case'?CK.indexOf(r.c):opts.indexOf(rightOf(r))}
  cr.cur={it,r,kind,typed,opts,ok,done:false};
  const flag=kind==='case'?'Какой это падеж?':kind==='pair'?'Куда или где?':'Вставь нужную форму';
  app.innerHTML=`<div class="wrap">${qTop()}
  <div class="card"><span class="flag">${flag}</span>
   <div class="csent q" lang="sr-Latn">${sentHTML(r,kind==='case'?'plain':'blank')}</div>
   ${kind!=='case'?`<div class="hintw" lang="sr-Latn">${esc(n.f.s.N.join(''))} <span lang="ru">— ${esc(n.ru)}</span></div>`:''}
   <div class="ctr" lang="ru">${esc(r.ru)}</div></div>
  ${typed?typeBox():`<div class="opts${kind==='case'?' copts':''}">${opts.map((o,k)=>kind==='case'?`<button class="opt k${o}" data-copt="${k}"><i class="dot"></i><span class="cn">${CM[o].ru} <span class="srn" lang="sr-Latn">${CM[o].sr}</span><small>${CM[o].q}</small></span></button>`:`<button class="opt" data-copt="${k}" lang="sr-Latn">${esc(o)}</button>`).join('')}</div>`}
  <div id="cx"></div></div>`;
  window.scrollTo(0,0);
  if(typed){const f=document.getElementById('tf');f.addEventListener('submit',e=>{e.preventDefault();cType()});setTimeout(()=>{const i=document.getElementById('ti');i&&i.focus({preventScroll:true})},50)}
}
const plainLat=s=>s.toLowerCase().replace(/đ/g,'dj').replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').trim();
function cType(){const c=cr.cur;if(!c||c.done)return;const inp=document.getElementById('ti');const v=(inp.value||'').trim();if(!v){inp.focus();return}
  const want=rightOf(c.r);let res;
  if(v.toLowerCase()===want.toLowerCase())res='ok';else if(plainLat(v)===plainLat(want))res='almost';else res='no';
  inp.readOnly=true;inp.classList.add(res==='no'?'no':'ok');app.querySelector('#tf button').disabled=true;
  finish(res!=='no',res==='almost'?`Засчитано, но пиши с диакритикой: <b lang="sr-Latn">${esc(want)}</b>`:res==='no'?`Правильно: <b lang="sr-Latn">${esc(want)}</b>`:'')}
function cPick(k){const c=cr.cur;if(!c||c.done||c.typed)return;const right=k===c.ok;
  const btns=app.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);btns[c.ok].classList.add('ok');if(!right)btns[k].classList.add('no');
  finish(right,'')}
function errKey(it){return it.t==='verb'?it.v.key:it.t==='pair'?'pair:'+it.r.s:it.r.s}
function pairCard(r){const a=r.c==='A'?r:r.mate,l=r.c==='L'?r:r.mate;
  return `<div class="pairc">${[a,l].map(x=>`<div class="pc k${x.c}${x===r?' me':''}"><span class="cbadge k${x.c}">${x.c==='A'?'куда?':'где?'} · ${CM[x.c].sr}</span><div class="csent sm" lang="sr-Latn">${sentHTML(x)}</div><div class="ctr">${esc(x.ru)}</div></div>`).join('')}
  <p class="mini-n">u / na + куда? → Akuzativ (идёшь туда) · u / na + где? → Lokativ (уже там)</p></div>`}
function finish(right,note){const c=cr.cur;c.done=true;const it=c.it,key=errKey(it);
  if(right){cr.ok++;delete S.cs.e[key]}else{S.cs.e[key]=1;cr.bad.push(it)}save();
  let body;
  if(it.t==='verb'){const v=it.v;body=`<div class="ccard ex"><div class="badges"><span class="cbadge k${v.c}">${CM[v.c].ru} · ${CM[v.c].sr}</span></div>
     <div class="cfrom" lang="sr-Latn">${esc(vBase(v))} ${esc(vLabel(v.c,v.p))} <em lang="ru">${esc(v.ru)} ${CM[v.c].q}</em></div>
     <div class="crule"><b lang="sr-Latn">${esc(v.ex)}</b><p>${esc(v.exr)}</p></div></div>`;
    const s=app.querySelector('.csent .gap');if(s)s.outerHTML=`<b class="end k${v.c}">${esc(vLabel(v.c,v.p))}</b>`}
  else{const s=app.querySelector('.csent.q');if(s)s.innerHTML=sentHTML(c.r);
    body=`<div class="ccard ex">${it.t==='pair'?pairCard(c.r):explain(c.r)}</div>`}
  document.getElementById('cx').innerHTML=`<div class="verdict ${right?'fast':'wrong'}">${right?'Верно':'Неверно · ушло в ошибки'}</div>
   ${note?`<p class="tnote">${note}</p>`:''}${body}
   <button class="primary" data-cact="qnext" style="width:100%">${cr.i+1<cr.q.length?'Дальше':'Итоги'}</button>`;
  setTimeout(()=>{const b=document.querySelector('[data-cact="qnext"]');b&&b.focus({preventScroll:true})},30);
}
function cRes(){const N=cr.q.length,x=cr.bad.length,ne=cErrItems().length,bad=cr.bad;
  app.innerHTML=`<div class="wrap"><header><h1>${x?'Проверка пройдена':'Без единой ошибки!'}</h1><p class="sub">${N} ${plural(N,'вопрос','вопроса','вопросов')} · ${esc(cr.title)}</p></header>
  <div class="big3 two"><div class="g"><b>${cr.ok}</b><span>верно</span></div><div class="r"><b>${x}</b><span>ошибки</span></div></div>
  <div class="btns">${ne?`<button class="primary" data-cact="errors">Работа над ошибками · ${ne}</button>`:''}
   <button class="ghost" data-cact="again">Ещё раз такую же тренировку</button><button class="ghost" data-cact="home">На главную</button></div>
  ${x?`<div class="block"><h2>Повторить</h2><div class="list">${bad.map(it=>it.t==='verb'?`<div><span class="s" lang="sr-Latn">${esc(vBase(it.v))} ${esc(vLabel(it.v.c,it.v.p))}</span><span class="r">${esc(it.v.ru)} · ${esc(it.v.ex)}</span></div>`:`<div><span class="s" lang="sr-Latn">${sentHTML(it.r)}</span><span class="r">${CM[it.r.c].ru} (${CM[it.r.c].sr})${it.r.num==='p'?', мн.ч.':''} · ${esc(it.r.ru)}</span></div>`).join('')}</div></div>`:''}</div>`;
  cLast=cr.mode;cr=null;window.scrollTo(0,0);
}
let cLast='test';
function startMode(m){const lim=a=>S.cs.size==='all'?a:a.slice(0,S.cs.size);let q,t;
  if(m==='pairs'){q=lim(shuffle(PROWS.slice())).map(r=>({t:'pair',r}));t='Куда или где?'}
  else if(m==='verbs'){q=lim(shuffle(VB.slice())).map(v=>({t:'verb',v}));t='Глаголы и выражения'}
  else if(m==='errors'){q=shuffle(cErrItems());t='Работа над ошибками'}
  else{q=lim(shuffle(cFilter(CTEST).slice())).map(r=>({t:'row',r}));t='Падежи'}
  caseTest(q,t);if(cr)cr.mode=m}
function caseClick(b){const d=b.dataset;
  if(d.cc){const on=new Set(S.cs.on);on.has(d.cc)?on.delete(d.cc):on.add(d.cc);if(!on.size)on.add(d.cc);S.cs.on=CK.filter(c=>on.has(c));save();casesHome();return true}
  if(d.cnum){S.cs.num=d.cnum;save();casesHome();return true}
  if(d.cqt){S.cs.qt=d.cqt;save();casesHome();return true}
  if(d.cinp){S.cs.inp=d.cinp;save();casesHome();return true}
  if(d.csize){S.cs.size=d.csize==='all'?'all':+d.csize;save();casesHome();return true}
  if(d.copt!==undefined&&cr){cPick(+d.copt);return true}
  if(d.ins&&cr){const i=document.getElementById('ti');if(i&&!i.readOnly){const a=i.selectionStart??i.value.length,z=i.selectionEnd??a;i.value=i.value.slice(0,a)+d.ins+i.value.slice(z);i.focus();i.setSelectionRange(a+1,a+1)}return true}
  if(d.cform&&cst){const [c,m]=d.cform.split('|'),r0=cst.q[cst.i];cst.v=(c===r0.c&&m===r0.num)?null:exampleFor(r0.n,c,m);cCard(1);return true}
  const a=d.cact;if(!a)return false;
  if(a==='sheet')caseSheet();
  else if(a==='home'){cst=null;cr=null;casesHome();window.scrollTo(0,0)}
  else if(a==='study')caseStudy();
  else if(a==='prev'&&cst){cst.v=null;cst.i=Math.max(0,cst.i-1);cCard()}
  else if(a==='back0'&&cst){cst.v=null;cCard(1)}
  else if(a==='next'&&cst){cst.v=null;cst.i++;if(cst.i>=cst.q.length){cst=null;casesHome()}else cCard()}
  else if(a==='test'||a==='pairs'||a==='verbs'||a==='errors')startMode(a);
  else if(a==='again')startMode(cLast==='errors'?'test':cLast);
  else if(a==='qnext'&&cr){cr.i++;cr.i>=cr.q.length?cRes():cQ()}
  return true}
document.addEventListener('keydown',e=>{if(!cr||!cr.cur)return;if(e.target&&e.target.tagName==='INPUT')return;const n=cr.cur.opts.length;if(/^[1-6]$/.test(e.key)&&+e.key<=n&&!cr.cur.done&&!cr.cur.typed)cPick(+e.key-1);else if(e.key==='Enter'&&cr.cur.done){e.preventDefault();cr.i++;cr.i>=cr.q.length?cRes():cQ()}});

home();
})();

</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
